# Aevum console —— HTTP 入口
# install.sh 会把 @APP_ROOT@ 与 @DOMAIN@ 替换成真实值后放到 /etc/nginx/conf.d/。
# 具体 root、location、反代和 WebSocket 都在 nginx-common.conf，HTTPS 入口复用同一份。
#
# 如果 443 上已经有别的首页，把 server_name 换成子域名（例如 console.mrhua.cn），
# 不要直接覆盖现有站点。

server {
    listen 80;
    listen [::]:80;
    server_name @DOMAIN@;

    include /etc/nginx/aevum-console-common.conf;

    access_log /var/log/nginx/aevum-console.access.log;
    error_log  /var/log/nginx/aevum-console.error.log;
}

# Aevum console —— HTTP 与 HTTPS 共用的 server 上下文
# install.sh 会替换 @APP_ROOT@ / @DOMAIN@，并安装到 /etc/nginx/aevum-console-common.conf。

root @APP_ROOT@/interface/web;
index index.html;
charset utf-8;
client_max_body_size 8m;
server_tokens off;

# 模型与动作库是大文件，走 sendfile 减少用户态拷贝；tcp_nopush 让首包更快出。
sendfile on;
tcp_nopush on;

# MrHua 的 app-shell.js 体积较大，且 partial / 引擎脚本很多。
# 打开 gzip 后首屏 JS/CSS/JSON 的传输量明显下降；不改任何前端内容。
gzip on;
gzip_vary on;
gzip_proxied any;
gzip_comp_level 5;
gzip_min_length 1024;
gzip_types text/plain text/css text/xml application/javascript application/json application/xml image/svg+xml;

location = / {
    try_files /index.html =404;
}

location / {
    try_files $uri $uri/ /index.html;
}

# 验证页必须走 engine 的真实文件，不能掉进上面的 index.html fallback。
location = /engine {
    return 302 /engine/validate.html;
}

location = /engine/ {
    return 302 /engine/validate.html;
}

# 角色模型和动作库体积大，且很少改动；允许浏览器缓存 7 天。
# 页面脚本仍走下面的 /engine/ 规则保持 no-cache，换版本刷新即可生效。
location ^~ /engine/assets/models/ {
    root @APP_ROOT@;
    try_files $uri $uri/ =404;
    expires 7d;
    add_header X-Content-Type-Options "nosniff";
}

location = /engine/assets/all_animations.glb {
    root @APP_ROOT@;
    try_files $uri =404;
    expires 7d;
    add_header X-Content-Type-Options "nosniff";
}

location ^~ /engine/ {
    root @APP_ROOT@;
    try_files $uri $uri/ =404;

    # 页面脚本用 ?v= 做缓存版本；这里统一不缓存，换模型后刷新即可生效。
    add_header Cache-Control "no-cache";
    add_header X-Content-Type-Options "nosniff";
}

# 拆分后的 MrHua 页面：脚本在 interface/console，样式和 partial 在 interface/web/mrhua。
location = /mrhua {
    return 302 /mrhua/index.html;
}

location ^~ /mrhua/ {
    root @APP_ROOT@/interface/web;
    try_files $uri $uri/ =404;
}

location ^~ /interface/console/ {
    root @APP_ROOT@;
    try_files $uri $uri/ =404;
    add_header Cache-Control "no-cache";
}

# 兼容直接访问仓库路径的旧链接。
location ^~ /interface/web/ {
    root @APP_ROOT@;
    try_files $uri $uri/ =404;
    add_header Cache-Control "no-cache";
}

location ~* \.(png|ico|svg|woff2)$ {
    expires 30d;
    add_header Cache-Control "public";
}

# 中继 API：同域 /v1/ 直接进内存中继
location /v1/ {
    proxy_pass http://127.0.0.1:8790;
    proxy_http_version 1.1;
    proxy_set_header Host              $host;
    proxy_set_header X-Real-IP         $remote_addr;
    proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_buffering off;
    proxy_request_buffering off;
    proxy_read_timeout 300s;
    proxy_send_timeout 300s;
}

# 监控与模型后端已归档，/api/ 与 /legacy 不再代理到 8781。
# 桌面入口直接落到静态页，避免 502。
location = /desktop {
    return 302 /desktop.html;
}

# 桥接的 WebSocket：同域 /ws，https 页面自动用 wss 连它
location /ws {
    proxy_pass http://127.0.0.1:8765;
    proxy_http_version 1.1;
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection "upgrade";
    proxy_read_timeout 3600s;
}

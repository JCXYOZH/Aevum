# Aevum console —— 一个对外端口，静态页与 WebSocket 同域
# 安装脚本会把 @APP_ROOT@ 与 @DOMAIN@ 替换成真实值后放到 /etc/nginx/conf.d/
#
# 如果 443 上已经有别的首页（比如现在那份单文件页），把 server_name 换成子域名
# （例如 console.mrhua.cn），不要直接覆盖现有站点。

server {
    listen 80;
    server_name @DOMAIN@;

    root @APP_ROOT@/apps/community/web;
    index index.html;

    location / {
        try_files $uri $uri/ /index.html;
    }

    location ~* \.(png|ico|svg|woff2)$ {
        expires 30d;
        add_header Cache-Control "public";
    }

    # 中继 API：同域 /v1/ 直接进内存中继
    location /v1/ {
        proxy_pass http://127.0.0.1:8790;
        proxy_http_version 1.1;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_buffering off;
        proxy_request_buffering off;
        proxy_read_timeout 300s;
        proxy_send_timeout 300s;
    }

    # 看板 API 与看板页面：都在 8781
    location /api/ {
        proxy_pass http://127.0.0.1:8781;
        proxy_http_version 1.1;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 300s;
        proxy_send_timeout 300s;
    }

    location = /desktop {
        proxy_pass http://127.0.0.1:8781;
        proxy_http_version 1.1;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location = /legacy {
        proxy_pass http://127.0.0.1:8781;
        proxy_http_version 1.1;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # 桥接的 WebSocket：同域 /ws，https 页面自动用 wss 连它
    location /ws {
        proxy_pass http://127.0.0.1:8765;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_read_timeout 3600s;
    }

    access_log /var/log/nginx/aevum-console.access.log;
    error_log  /var/log/nginx/aevum-console.error.log;
}

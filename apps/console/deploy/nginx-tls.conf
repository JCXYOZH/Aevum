# Aevum console —— HTTPS 入口
# install.sh 在检测到 /etc/letsencrypt/live/@DOMAIN@/ 证书后生成并启用；
# 没有证书时这个文件不会出现在 conf.d 里，避免 nginx -t 因缺证书失败。

server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name @DOMAIN@;

    ssl_certificate     /etc/letsencrypt/live/@DOMAIN@/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/@DOMAIN@/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers HIGH:!aNULL:!MD5;
    ssl_session_cache shared:SSL:10m;
    ssl_session_timeout 1d;

    include /etc/nginx/aevum-console-common.conf;

    access_log /var/log/nginx/aevum-console-https.access.log;
    error_log  /var/log/nginx/aevum-console-https.error.log;
}

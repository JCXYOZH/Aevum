# Aevum console —— HTTP 与 HTTPS 共用的 server 上下文
# install.sh 会替换 @APP_ROOT@ / @DOMAIN@，并安装到 /etc/nginx/aevum-console-common.conf。

root @APP_ROOT@/apps/community/web;
index index.html;
charset utf-8;
client_max_body_size 8m;
server_tokens off;

location / {
    try_files $uri $uri/ /index.html;
}

# 验证页必须走 engine 的真实文件，不能掉进上面的 index.html fallback。
location = /engine {
    return 302 /engine/validate.html;
}

location = /engine/ {
    return 302 /engine/validate.html;
}

location ^~ /engine/ {
    root @APP_ROOT@;
    try_files $uri $uri/ =404;

    # 页面脚本用 ?v= 做缓存版本；这里统一不缓存，换模型后刷新即可生效。
    add_header Cache-Control "no-cache";
    add_header X-Content-Type-Options "nosniff";
}

location ~* \.(png|ico|svg|woff2)$ {
    expires 30d;
    add_header Cache-Control "public";
}

# 中继 API：同域 /v1/ 直接进内存中继
location /v1/ {
    proxy_pass http://127.0.0.1:8790;
    proxy_http_version 1.1;
    proxy_set_header Host              $host;
    proxy_set_header X-Real-IP         $remote_addr;
    proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_buffering off;
    proxy_request_buffering off;
    proxy_read_timeout 300s;
    proxy_send_timeout 300s;
}

# 看板 API 与看板页面：都在 8781
location /api/ {
    proxy_pass http://127.0.0.1:8781;
    proxy_http_version 1.1;
    proxy_set_header Host              $host;
    proxy_set_header X-Real-IP         $remote_addr;
    proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_read_timeout 300s;
    proxy_send_timeout 300s;
}

location = /desktop {
    proxy_pass http://127.0.0.1:8781;
    proxy_http_version 1.1;
    proxy_set_header Host              $host;
    proxy_set_header X-Real-IP         $remote_addr;
    proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
}

location = /legacy {
    proxy_pass http://127.0.0.1:8781;
    proxy_http_version 1.1;
    proxy_set_header Host              $host;
    proxy_set_header X-Real-IP         $remote_addr;
    proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
}

# 桥接的 WebSocket：同域 /ws，https 页面自动用 wss 连它
location /ws {
    proxy_pass http://127.0.0.1:8765;
    proxy_http_version 1.1;
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection "upgrade";
    proxy_read_timeout 3600s;
}

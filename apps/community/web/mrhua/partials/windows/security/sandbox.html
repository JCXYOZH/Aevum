    <div class="window" id="win-sandbox" data-window="sandbox" style="width:700px;height:560px;top:8%;left:15%;">
        <div class="window-header"><span class="title">🔒 沙箱执行环境</span><div class="window-controls"><button class="btn-minimize">─</button><button class="btn-maximize">☐</button><button class="btn-close">✕</button></div></div>
        <div class="window-body" style="padding:16px;overflow-y:auto;">
            <div style="background:#ffebee;border:1px solid #ffcdd2;border-radius:10px;padding:10px 14px;margin-bottom:14px;font-size:0.82rem;color:#c62828;">
                🔒 沙箱中的命令和脚本在受限环境中运行，无法访问敏感目录和网络。适用于测试不可信脚本。
            </div>
            <div style="display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-bottom:14px;">
                <div>
                    <label style="font-size:0.82rem;color:#666;">超时(秒)</label>
                    <input type="number" id="sb-timeout" value="30" style="width:100%;padding:8px;border:1px solid #ddd;border-radius:8px;font-size:0.85rem;margin-top:4px;box-sizing:border-box;">
                </div>
                <div>
                    <label style="font-size:0.82rem;color:#666;">内存限制(MB)</label>
                    <input type="number" id="sb-mem" value="256" style="width:100%;padding:8px;border:1px solid #ddd;border-radius:8px;font-size:0.85rem;margin-top:4px;box-sizing:border-box;">
                </div>
            </div>
            <div style="margin-bottom:14px;">
                <label style="font-size:0.82rem;color:#666;">允许的网络访问</label>
                <div style="display:flex;gap:12px;margin-top:4px;">
                    <label style="font-size:0.82rem;"><input type="radio" name="sb-net" value="none" checked> 禁止网络</label>
                    <label style="font-size:0.82rem;"><input type="radio" name="sb-net" value="local"> 仅本地</label>
                    <label style="font-size:0.82rem;"><input type="radio" name="sb-net" value="all"> 全部允许</label>
                </div>
            </div>
            <textarea id="sb-code" placeholder="输入要在沙箱中执行的Python代码或Shell命令..." style="width:100%;height:200px;padding:10px;border:1px solid #ddd;border-radius:8px;font-family:monospace;font-size:0.82rem;resize:vertical;box-sizing:border-box;"></textarea>
            <div style="display:flex;gap:8px;margin-top:10px;">
                <button id="sb-run-py" style="flex:1;padding:10px;border:none;border-radius:8px;background:#6a4c93;color:#fff;cursor:pointer;">▶ 执行Python</button>
                <button id="sb-run-sh" style="flex:1;padding:10px;border:none;border-radius:8px;background:#e65100;color:#fff;cursor:pointer;">▶ 执行Shell</button>
            </div>
            <div id="sb-output" style="margin-top:10px;padding:12px;background:#1e1e2e;border-radius:8px;font-family:monospace;font-size:0.78rem;color:#cdd6f4;min-height:80px;max-height:200px;overflow-y:auto;white-space:pre-wrap;"></div>
        </div>
        <div class="window-resize-handle"></div>
    </div>

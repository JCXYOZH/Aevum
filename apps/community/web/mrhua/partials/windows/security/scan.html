    <div class="window" id="win-scan" data-window="scan" style="width:850px;height:650px;top:5%;left:5%;">
        <div class="window-header">
            <span class="title">🛠️ 工具箱</span>
            <div class="window-controls">
                <button class="btn-minimize" title="最小化">─</button>
                <button class="btn-maximize" title="最大化">☐</button>
                <button class="btn-close" title="关闭">✕</button>
            </div>
        </div>
        <div class="window-body">
            <div style="display:flex;gap:8px;margin-bottom:12px;">
                <input type="text" id="tool-nl-input" placeholder="💬 用自然语言描述要做什么，如：扫描 192.168.1.1 的80和443端口" style="flex:1;padding:10px 14px;border-radius:30px;border:1px solid var(--theme-primary);font-size:0.9rem;outline:none;" />
                <button id="tool-nl-suggest" style="padding:10px 18px;border:none;border-radius:30px;background:var(--theme-primary);color:#fff;cursor:pointer;white-space:nowrap;">推荐工具</button>
                <button id="tool-nl-run" style="padding:10px 18px;border:none;border-radius:30px;background:#52c41a;color:#fff;cursor:pointer;white-space:nowrap;">直接执行</button>
            </div>
            <div id="tool-nl-result" style="display:none;margin-bottom:12px;padding:10px 14px;background:#f8f5ff;border-radius:10px;font-size:0.85rem;max-height:120px;overflow-y:auto;"></div>
            <div style="display:flex;gap:8px;margin-bottom:12px;">
                <input type="text" id="tool-search" placeholder="🔍 搜索工具..." style="flex:1;padding:10px 14px;border-radius:30px;border:1px solid #ddd;font-size:0.95rem;outline:none;" />
                <button id="tool-check-btn" title="检查工具安装状态" style="padding:10px 16px;border:none;border-radius:30px;background:#1565c0;color:#fff;cursor:pointer;white-space:nowrap;">📦 状态</button>
            </div>
            <div id="tool-status-bar" style="display:none;margin-bottom:12px;padding:8px 14px;border-radius:10px;font-size:0.85rem;"></div>
            <div id="tool-grid" style="display:grid;grid-template-columns:repeat(auto-fill,minmax(130px,1fr));gap:14px;max-height:calc(100vh - 320px);overflow-y:auto;padding-bottom:10px;"></div>
        </div>
        <div class="window-resize-handle"></div>
    </div>

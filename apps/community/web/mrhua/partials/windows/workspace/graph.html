    <div class="window" id="win-graph" data-window="graph" style="width:800px;height:620px;top:6%;left:10%;">
        <div class="window-header"><span class="title">🕸️ 漏洞知识图谱</span><div class="window-controls"><button class="btn-minimize">─</button><button class="btn-maximize">☐</button><button class="btn-close">✕</button></div></div>
        <div class="window-body" style="padding:16px;overflow-y:auto;">
            <div style="display:flex;gap:8px;margin-bottom:12px;">
                <input type="text" id="graph-target" placeholder="目标IP/域名（如 example.com）" style="flex:1;padding:8px 12px;border:1px solid #ddd;border-radius:8px;font-size:0.85rem;">
                <button id="graph-scan" style="padding:8px 16px;border:none;border-radius:8px;background:#6a4c93;color:#fff;cursor:pointer;">🔍 扫描并构建</button>
                <button id="graph-refresh" style="padding:8px 14px;border:1px solid #ddd;border-radius:8px;background:#fff;cursor:pointer;">刷新</button>
                <button id="graph-clear" style="padding:8px 14px;border:1px solid #ffcdd2;border-radius:8px;background:#fff;color:#e53935;cursor:pointer;">清空</button>
            </div>
            <div id="graph-stats" style="display:grid;grid-template-columns:repeat(4,1fr);gap:8px;margin-bottom:12px;"></div>
            <div id="graph-legend" style="display:flex;flex-wrap:wrap;gap:10px;margin-bottom:8px;font-size:0.72rem;color:#666;"></div>
            <div id="graph-canvas" style="width:100%;height:900px;border:1px solid #eee;border-radius:12px;background:#fafafa;position:relative;overflow:hidden;"></div>
            <div id="graph-detail" style="margin-top:10px;padding:12px;background:#f5f0fa;border-radius:10px;font-size:0.82rem;color:#555;display:none;max-height:120px;overflow-y:auto;"></div>
        </div>
        <div class="window-resize-handle"></div>
    </div>

# ============================================================
# nginx-aevum.conf — static site + in-memory relay on the same origin
#
# install.sh replaces __DOMAIN__ / __WEBROOT__ / __RELAY_TOKEN__.
# TLS is added in place by `certbot --nginx`; this file stays HTTP-only so a
# fresh machine can boot before DNS and the certificate are ready.
#
# Why buffering is off: transfers stream chunk by chunk. With proxy buffering
# on, nginx would spool a 4 MiB transfer to disk before the client sees a byte,
# which is exactly what this relay exists to avoid.
# ============================================================

server {
    listen 80;
    listen [::]:80;
    server_name __DOMAIN__;

    server_tokens off;
    root __WEBROOT__;
    index index.html;

    charset utf-8;

    gzip on;
    gzip_types text/plain text/css application/json application/javascript image/svg+xml;
    gzip_min_length 1024;

    location / {
        try_files $uri $uri/ =404;
    }

    location ~ /\. {
        deny all;
    }

    location /v1/ {
        proxy_pass http://127.0.0.1:8790;
        proxy_http_version 1.1;

        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # The token never reaches the browser: nginx adds it for every /v1 call.
        proxy_set_header X-Relay-Token "__RELAY_TOKEN__";

        proxy_buffering off;
        proxy_request_buffering off;
        proxy_read_timeout 300s;
        proxy_send_timeout 300s;

        client_max_body_size 8m;
    }

    access_log /var/log/nginx/aevum.access.log;
    error_log  /var/log/nginx/aevum.error.log warn;
}

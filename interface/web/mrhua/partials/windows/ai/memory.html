    <div class="window" id="win-memory" data-window="memory" style="width:750px;height:600px;top:8%;left:15%;">
        <div class="window-header">
            <span class="title">🧠 记忆浏览</span>
            <div class="window-controls">
                <button class="btn-minimize" title="最小化">─</button>
                <button class="btn-maximize" title="最大化">☐</button>
                <button class="btn-close" title="关闭">✕</button>
            </div>
        </div>
        <div class="window-body" style="padding:0;">
            <div style="display:flex;border-bottom:1px solid #eee;">
                <button class="mem-tab active" data-tab="scan" style="flex:1;padding:12px;border:none;background:none;cursor:pointer;font-size:0.9rem;font-weight:600;color:var(--theme-primary);border-bottom:2px solid var(--theme-primary);">🔍 扫描记忆</button>
                <button class="mem-tab" data-tab="river" style="flex:1;padding:12px;border:none;background:none;cursor:pointer;font-size:0.9rem;font-weight:600;color:#999;border-bottom:2px solid transparent;">🌊 记忆河流</button>
            </div>
            <div style="padding:12px 16px;display:flex;gap:8px;align-items:center;">
                <input type="text" id="mem-search" placeholder="搜索记忆..." style="flex:1;padding:8px 14px;border-radius:20px;border:1px solid #ddd;font-size:0.85rem;outline:none;" />
                <button id="mem-refresh" style="padding:8px 16px;border:none;border-radius:20px;background:var(--theme-primary);color:#fff;cursor:pointer;font-size:0.85rem;">刷新</button>
            </div>
            <div id="mem-list" style="padding:0 16px 16px;overflow-y:auto;max-height:calc(100vh - 240px);"></div>
        </div>
        <div class="window-resize-handle"></div>
    </div>

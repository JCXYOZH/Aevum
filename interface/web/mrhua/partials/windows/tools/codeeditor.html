    <div class="window" id="win-codeeditor" data-window="codeeditor" style="width:960px;height:700px;top:3%;left:5%;">
        <div class="window-header">
            <span class="title">📂 代码编辑器</span>
            <div class="window-controls">
                <button class="btn-minimize" title="最小化">─</button>
                <button class="btn-maximize" title="最大化">☐</button>
                <button class="btn-close" title="关闭">✕</button>
            </div>
        </div>
        <div class="window-body" style="display:flex;gap:0;padding:0;overflow:hidden;">
            <!-- 左侧文件面板 -->
            <div style="width:220px;background:#252535;display:flex;flex-direction:column;border-right:1px solid #3a3a4a;">
                <div style="padding:8px 10px;border-bottom:1px solid #3a3a4a;display:flex;gap:6px;">
                    <input type="text" id="ce-dir" placeholder="目录路径" value="." style="flex:1;padding:5px 8px;border-radius:6px;border:1px solid #4a4a5a;background:#1e1e2e;color:#cdd6f4;font-size:0.78rem;" />
                    <button id="ce-browse" style="padding:5px 10px;border:none;border-radius:6px;background:var(--theme-primary);color:#fff;cursor:pointer;font-size:0.78rem;">打开</button>
                </div>
                <div id="ce-filelist" style="flex:1;overflow-y:auto;padding:6px 0;font-family:'SF Mono',Menlo,monospace;font-size:0.8rem;"></div>
                <div style="padding:8px 10px;border-top:1px solid #3a3a4a;display:flex;gap:6px;">
                    <button id="ce-newfile" style="flex:1;padding:6px;border:none;border-radius:6px;background:#27ae60;color:#fff;cursor:pointer;font-size:0.78rem;">+ 新文件</button>
                </div>
            </div>
            <!-- 右侧编辑区 -->
            <div style="flex:1;display:flex;flex-direction:column;min-width:0;">
                <div style="padding:8px 12px;background:#2a2a3a;border-bottom:1px solid #3a3a4a;display:flex;gap:8px;align-items:center;flex-wrap:wrap;">
                    <span id="ce-filename" style="color:#cdd6f4;font-size:0.85rem;font-family:monospace;">未打开文件</span>
                    <span style="flex:1;"></span>
                    <select id="ce-speed" style="padding:4px 8px;border-radius:6px;border:1px solid #4a4a5a;background:#1e1e2e;color:#cdd6f4;font-size:0.78rem;">
                        <option value="0">极速</option>
                        <option value="15" selected>正常</option>
                        <option value="35">慢速</option>
                        <option value="70">打字机</option>
                    </select>
                    <button id="ce-save" style="padding:5px 12px;border:none;border-radius:6px;background:#27ae60;color:#fff;cursor:pointer;font-size:0.78rem;">💾 保存</button>
                    <button id="ce-copy" style="padding:5px 12px;border:none;border-radius:6px;background:#3498db;color:#fff;cursor:pointer;font-size:0.78rem;">📋 复制</button>
                </div>
                <div id="ce-thinking-box" style="display:none;max-height:100px;overflow:auto;background:#2a2535;border-bottom:1px solid #3a3a4a;padding:6px 12px;">
                    <div style="font-size:0.72rem;color:var(--theme-primary-light);font-weight:600;">💭 思考中...</div>
                    <div id="ce-thinking" style="font-size:0.76rem;color:#888;white-space:pre-wrap;line-height:1.4;"></div>
                </div>
                <div style="flex:1;overflow:auto;background:#1e1e2e;position:relative;">
                    <textarea id="ce-editor" spellcheck="false" style="position:absolute;inset:0;width:100%;height:100%;padding:14px;border:none;outline:none;resize:none;background:transparent;color:#cdd6f4;font-family:'SF Mono',Menlo,Consolas,monospace;font-size:0.85rem;line-height:1.6;white-space:pre;tab-size:4;"></textarea>
                </div>
                <div style="padding:8px 12px;background:#2a2a3a;border-top:1px solid #3a3a4a;display:flex;gap:8px;align-items:center;">
                    <input type="text" id="ce-instruction" placeholder="告诉模型如何修改这个文件，如：添加错误处理、优化性能..." style="flex:1;padding:7px 12px;border-radius:8px;border:1px solid #4a4a5a;background:#1e1e2e;color:#cdd6f4;font-size:0.82rem;" />
                    <button id="ce-apply" style="padding:7px 16px;border:none;border-radius:8px;background:linear-gradient(135deg,var(--theme-primary),var(--theme-primary-light));color:#fff;cursor:pointer;font-size:0.82rem;font-weight:600;">🤖 AI修改</button>
                    <button id="ce-stop" style="display:none;padding:7px 16px;border:none;border-radius:8px;background:var(--theme-accent);color:#fff;cursor:pointer;font-size:0.82rem;">⏹ 停止</button>
                </div>
                <div id="ce-status" style="display:none;padding:6px 12px;font-size:0.78rem;border-top:1px solid #3a3a4a;"></div>
            </div>
        </div>
        <div class="window-resize-handle"></div>
    </div>

    <div class="window" id="win-subscribe" data-window="subscribe" style="width:620px;height:520px;top:14%;left:20%;">
        <div class="window-header">
            <span class="title">📮 订阅 · Aevum 更新</span>
            <div class="window-controls">
                <button class="btn-minimize" title="最小化">─</button>
                <button class="btn-maximize" title="最大化">☐</button>
                <button class="btn-close" title="关闭">✕</button>
            </div>
        </div>
        <div class="window-body subscribe-body">
            <div class="subscribe-note">
                <span class="subscribe-note__eyebrow">AEVUM · LOOP</span>
                <p><b>只发 Aevum 的更新与发布记录。</b></p>
                <p>一个人一封信，不群发，也不数你打开了没有。提交后先等一封确认信；点开确认，才算正式订阅。</p>
            </div>

            <form id="loop-subscribe-form" class="subscribe-form" novalidate>
                <div class="field">
                    <label for="loop-subscribe-email">邮箱</label>
                    <input id="loop-subscribe-email" type="email" autocomplete="email" placeholder="name@example.com" required>
                </div>

                <div class="field">
                    <label for="loop-subscribe-scope">订阅事项</label>
                    <input id="loop-subscribe-scope" type="text" value="Aevum 更新与发布记录" readonly>
                </div>

                <label class="subscribe-consent">
                    <input id="loop-subscribe-consent" type="checkbox">
                    <span>我同意接收这类更新邮件，并知道可以随时退订。</span>
                </label>

                <button class="tbtn tbtn--solid subscribe-submit" id="loop-subscribe-submit" type="submit">订阅</button>
            </form>

            <div id="loop-subscribe-result" class="subscribe-result" role="status" aria-live="polite"></div>

            <div class="subscribe-foot">
                这里只留下邮箱、同意时间、订阅事项和来源；不记完整链接、搜索词、IP 或浏览器。<br>
                每封信底部都有退订入口，不用登录。
            </div>
        </div>
        <div class="window-resize-handle"></div>
    </div>

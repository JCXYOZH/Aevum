    <div class="window" id="win-settings" data-window="settings" style="width:680px;height:640px;top:6%;left:20%;">
        <div class="window-header">
            <span class="title">⚙️ 系统设置</span>
            <div class="window-controls">
                <button class="btn-minimize" title="最小化">─</button>
                <button class="btn-maximize" title="最大化">☐</button>
                <button class="btn-close" title="关闭">✕</button>
            </div>
        </div>
        <div class="window-body" style="display:flex;flex-direction:column;gap:12px;overflow-y:auto;padding:16px;">
            <div id="sys-settings-area"><div style="text-align:center;padding:20px;color:#999;">加载中...</div></div>
            <div style="padding:10px 14px;background:#f3e5f5;border:1px solid #ce93d8;border-radius:10px;">
                <label style="font-size:0.85rem;color:#6a1b9a;font-weight:600;">🔑 云端 API 密钥</label>
                <div style="display:flex;gap:6px;margin-top:8px;">
                    <input type="password" id="cloud-api-key-input" placeholder="粘贴 API 密钥（仅本次运行有效，不保存）" style="flex:1;padding:6px 10px;border:1px solid #ce93d8;border-radius:6px;font-size:0.8rem;font-family:monospace;" autocomplete="off" />
                    <button id="cloud-key-toggle" title="显示/隐藏" style="padding:6px 10px;background:#fff;border:1px solid #ce93d8;border-radius:6px;cursor:pointer;font-size:0.8rem;">👁</button>
                    <button id="cloud-key-apply" style="padding:6px 14px;background:#8e24aa;color:#fff;border:none;border-radius:6px;cursor:pointer;font-size:0.8rem;">应用</button>
                </div>
                <div id="cloud-key-status" style="font-size:0.75rem;color:#666;margin-top:6px;">检查中...</div>
                <div style="font-size:0.7rem;color:#999;margin-top:3px;">密钥仅保存在内存中，应用重启后需重新填写。若 config.yaml 已配置密钥则自动显示。</div>
            </div>
            <div style="padding:10px 14px;background:#f3e5f5;border:1px solid #ce93d8;border-radius:10px;">
                <label style="font-size:0.85rem;color:#6a1b9a;font-weight:600;">🔮 灵体皮肤</label>
                <div id="orb-skin-list" style="display:flex;gap:8px;margin-top:8px;flex-wrap:wrap;"></div>
                <div style="font-size:0.7rem;color:#999;margin-top:4px;">不内置角色，自己定制或导入。每个身份档案独立保存。Live2D 使用自研渲染器 + Cubism Core（本地）。</div>
            </div>
            <div style="padding:10px 14px;background:#fff8e1;border:1px solid #ffe082;border-radius:10px;">
                <label style="display:flex;align-items:center;gap:8px;cursor:pointer;font-size:0.85rem;color:#555;">
                    <input type="checkbox" id="cloud-privacy-toggle" checked style="width:16px;height:16px;cursor:pointer;" />
                    <span>🔒 云端隐私保护（开启后云端模型不接收本地记忆和扫描数据）</span>
                </label>
                <div id="cloud-privacy-status" style="font-size:0.75rem;color:#888;margin-top:4px;"></div>
            </div>
            <div style="padding:10px 14px;background:#e3f2fd;border:1px solid #90caf9;border-radius:10px;">
                <label style="font-size:0.85rem;color:#1565c0;font-weight:600;">🌐 网络搜索授权等级</label>
                <div style="display:flex;gap:4px;margin-top:8px;flex-wrap:wrap;">
                    <button class="search-auth-btn" data-level="0" style="flex:1;min-width:60px;padding:6px 4px;border:2px solid #ccc;border-radius:6px;background:#fff;cursor:pointer;font-size:0.72rem;color:#666;">🔍 基础</button>
                    <button class="search-auth-btn" data-level="1" style="flex:1;min-width:60px;padding:6px 4px;border:2px solid #ccc;border-radius:6px;background:#fff;cursor:pointer;font-size:0.72rem;color:#666;">🔎 标准</button>
                    <button class="search-auth-btn" data-level="2" style="flex:1;min-width:60px;padding:6px 4px;border:2px solid #ccc;border-radius:6px;background:#fff;cursor:pointer;font-size:0.72rem;color:#666;">📄 搜索+浏览</button>
                    <button class="search-auth-btn" data-level="3" style="flex:1;min-width:60px;padding:6px 4px;border:2px solid #ccc;border-radius:6px;background:#fff;cursor:pointer;font-size:0.72rem;color:#666;">🌐 完全授权</button>
                </div>
                <div id="search-auth-desc" style="font-size:0.75rem;color:#666;margin-top:6px;"></div>
            </div>
            <div style="padding:10px 14px;background:#fff3e0;border:1px solid #ffcc80;border-radius:10px;">
                <label style="font-size:0.85rem;color:#e65100;font-weight:600;">🧭 搜索时浏览器追踪</label>
                <div style="display:flex;gap:4px;margin-top:8px;flex-wrap:wrap;">
                    <button class="browser-track-btn" data-mode="internal" style="flex:1;min-width:80px;padding:6px 4px;border:2px solid #ffcc80;border-radius:6px;background:#fff3e0;cursor:pointer;font-size:0.72rem;color:#e65100;font-weight:600;">📱 内置浏览器</button>
                    <button class="browser-track-btn" data-mode="external" style="flex:1;min-width:80px;padding:6px 4px;border:2px solid #ccc;border-radius:6px;background:#fff;cursor:pointer;font-size:0.72rem;color:#666;">🌍 系统浏览器</button>
                    <button class="browser-track-btn" data-mode="off" style="flex:1;min-width:80px;padding:6px 4px;border:2px solid #ccc;border-radius:6px;background:#fff;cursor:pointer;font-size:0.72rem;color:#666;">🚫 不追踪</button>
                </div>
                <div id="browser-track-desc" style="font-size:0.75rem;color:#666;margin-top:6px;">搜索时在内置浏览器中打开模型查看的页面</div>
            </div>
            <div style="padding:10px 14px;background:#e8f5e9;border:1px solid #a5d6a7;border-radius:10px;">
                <label style="font-size:0.85rem;color:#2e7d32;font-weight:600;">🛡 SSH隧道（跳板机）加密传输</label>
                <div style="display:grid;grid-template-columns:1fr 80px;gap:6px;margin-top:8px;">
                    <input type="text" id="ssh-host" placeholder="跳板机地址 如 123.45.67.89" style="padding:6px 8px;border:1px solid #c8e6c9;border-radius:6px;font-size:0.8rem;" />
                    <input type="number" id="ssh-port" placeholder="端口" value="22" style="padding:6px 8px;border:1px solid #c8e6c9;border-radius:6px;font-size:0.8rem;" />
                </div>
                <div style="display:grid;grid-template-columns:1fr 1fr;gap:6px;margin-top:6px;">
                    <input type="text" id="ssh-user" placeholder="SSH用户名" style="padding:6px 8px;border:1px solid #c8e6c9;border-radius:6px;font-size:0.8rem;" />
                    <input type="text" id="ssh-key" placeholder="私钥路径 如 ~/.ssh/id_rsa" style="padding:6px 8px;border:1px solid #c8e6c9;border-radius:6px;font-size:0.8rem;" />
                </div>
                <div style="display:flex;gap:6px;margin-top:8px;align-items:center;flex-wrap:wrap;">
                    <button id="ssh-tunnel-btn" style="padding:6px 14px;background:#43a047;color:#fff;border:none;border-radius:6px;cursor:pointer;font-size:0.8rem;">连接隧道</button>
                    <button id="ssh-detect-btn" title="自动检测SSH密钥和配置" style="padding:6px 10px;background:#1565c0;color:#fff;border:none;border-radius:6px;cursor:pointer;font-size:0.75rem;">🔍 自动检测</button>
                    <label style="display:flex;align-items:center;gap:4px;font-size:0.75rem;color:#555;cursor:pointer;">
                        <input type="checkbox" id="ssh-autoconnect" style="width:13px;height:13px;cursor:pointer;" /> 开机自动连接
                    </label>
                    <span id="ssh-tunnel-status" style="font-size:0.75rem;color:#666;">未连接</span>
                </div>
                <div id="ssh-hint" style="font-size:0.72rem;color:#888;margin-top:4px;">启用后，云端API流量通过SSH SOCKS5加密隧道传输，本地网络不可见明文</div>
            </div>
            <div style="padding:10px 14px;background:#e3f2fd;border:1px solid #90caf9;border-radius:10px;">
                <div style="display:flex;align-items:center;justify-content:space-between;">
                    <label style="font-size:0.85rem;color:#1565c0;font-weight:600;">🔐 隐私脱敏引擎</label>
                    <label style="display:flex;align-items:center;gap:4px;cursor:pointer;font-size:0.78rem;color:#555;">
                        <input type="checkbox" id="privacy-enabled" checked style="width:14px;height:14px;cursor:pointer;" />
                        <span>启用</span>
                    </label>
                </div>
                <div id="privacy-status" style="font-size:0.75rem;color:#666;margin-top:6px;">加载中...</div>
                <div style="display:flex;gap:6px;margin-top:6px;flex-wrap:wrap;">
                    <button id="privacy-test-btn" style="padding:4px 10px;background:#1976d2;color:#fff;border:none;border-radius:4px;cursor:pointer;font-size:0.72rem;">测试脱敏</button>
                    <span style="font-size:0.7rem;color:#888;align-self:center;">云端只看到占位符，回复后本地还原</span>
                </div>
            </div>
            <div style="padding:10px 14px;background:#f3e5f5;border:1px solid #ce93d8;border-radius:10px;">
                <div style="display:flex;align-items:center;justify-content:space-between;">
                    <label style="font-size:0.85rem;color:#6a1b9a;font-weight:600;">👁 视觉引擎（OCR/验证码/截图分析）</label>
                    <label style="display:flex;align-items:center;gap:4px;cursor:pointer;font-size:0.78rem;color:#555;">
                        <input type="checkbox" id="vision-enabled" style="width:14px;height:14px;cursor:pointer;" />
                        <span>启用</span>
                    </label>
                </div>
                <div id="vision-options" style="margin-top:8px;display:none;flex-direction:column;gap:6px;">
                    <label style="display:flex;align-items:center;gap:6px;font-size:0.78rem;color:#555;cursor:pointer;">
                        <input type="checkbox" id="vision-ocr" class="vision-opt" style="width:13px;height:13px;cursor:pointer;" checked />
                        <span>OCR文字识别（截图/图片中提取文字）</span>
                    </label>
                    <label style="display:flex;align-items:center;gap:6px;font-size:0.78rem;color:#555;cursor:pointer;">
                        <input type="checkbox" id="vision-captcha" class="vision-opt" style="width:13px;height:13px;cursor:pointer;" />
                        <span>验证码自动识别填入</span>
                    </label>
                    <label style="display:flex;align-items:center;gap:6px;font-size:0.78rem;color:#555;cursor:pointer;">
                        <input type="checkbox" id="vision-browser" class="vision-opt" style="width:13px;height:13px;cursor:pointer;" />
                        <span>浏览器自动截图分析（每次导航后分析页面类型）</span>
                    </label>
                    <label style="display:flex;align-items:center;gap:6px;font-size:0.78rem;color:#555;cursor:pointer;">
                        <input type="checkbox" id="vision-classifier" class="vision-opt" style="width:13px;height:13px;cursor:pointer;" />
                        <span>CLIP图像分类（模型较大，CPU较慢）</span>
                    </label>
                    <div id="vision-status" style="font-size:0.72rem;color:#888;margin-top:4px;"></div>
                </div>
                <div style="font-size:0.72rem;color:#999;margin-top:4px;">所有图像处理在本地完成，不上传云端；仅结构化文本结果传给模型</div>
            </div>
        </div>
        <div class="window-resize-handle"></div>
    </div>

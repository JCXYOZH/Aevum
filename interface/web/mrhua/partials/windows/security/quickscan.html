    <div class="window" id="win-quickscan" data-window="quickscan" style="width:750px;height:600px;top:8%;left:12%;">
        <div class="window-header">
            <span class="title">⚡ 快速扫描</span>
            <div class="window-controls">
                <button class="btn-minimize" title="最小化">─</button>
                <button class="btn-maximize" title="最大化">☐</button>
                <button class="btn-close" title="关闭">✕</button>
            </div>
        </div>
        <div class="window-body" style="padding:20px;overflow-y:auto;">
            <div style="margin-bottom:16px;">
                <label style="font-weight:600;color:#333;">🎯 扫描目标</label>
                <input type="text" id="qs-target" placeholder="IP地址或域名，如 192.168.1.1 或 example.com"
                    style="width:100%;padding:10px 14px;border-radius:10px;border:1px solid #ddd;margin-top:6px;font-size:0.95rem;outline:none;" />
            </div>
            <div style="margin-bottom:16px;">
                <label style="font-weight:600;color:#333;">📋 扫描模式</label>
                <div style="display:flex;gap:10px;margin-top:6px;flex-wrap:wrap;">
                    <button class="qs-mode-btn active" data-mode="fast" style="flex:1;min-width:120px;padding:12px;border:2px solid var(--theme-primary);border-radius:12px;background:#f3e5f5;cursor:pointer;text-align:center;">
                        <div style="font-size:1.5rem;">🚀</div><div style="font-weight:600;color:var(--theme-primary);">快速</div><div style="font-size:0.75rem;color:#888;">Ping+常用端口+DNS</div>
                    </button>
                    <button class="qs-mode-btn" data-mode="standard" style="flex:1;min-width:120px;padding:12px;border:2px solid #ddd;border-radius:12px;background:#fafafa;cursor:pointer;text-align:center;">
                        <div style="font-size:1.5rem;">🔍</div><div style="font-weight:600;color:#555;">标准</div><div style="font-size:0.75rem;color:#888;">1-1024端口+HTTP指纹</div>
                    </button>
                    <button class="qs-mode-btn" data-mode="full" style="flex:1;min-width:120px;padding:12px;border:2px solid #ddd;border-radius:12px;background:#fafafa;cursor:pointer;text-align:center;">
                        <div style="font-size:1.5rem;">🔬</div><div style="font-weight:600;color:#555;">全面</div><div style="font-size:0.75rem;color:#888;">全端口+WHOIS+SSL+子域名</div>
                    </button>
                    <button class="qs-mode-btn" data-mode="web" style="flex:1;min-width:120px;padding:12px;border:2px solid #ddd;border-radius:12px;background:#fafafa;cursor:pointer;text-align:center;">
                        <div style="font-size:1.5rem;">🌐</div><div style="font-weight:600;color:#555;">Web</div><div style="font-size:0.75rem;color:#888;">HTTP+SSL+目录扫描</div>
                    </button>
                </div>
            </div>
            <div style="display:flex;gap:12px;margin-bottom:16px;flex-wrap:wrap;align-items:flex-end;">
                <div style="flex:1;min-width:140px;">
                    <label style="font-weight:600;color:#333;font-size:0.85rem;">⏱️ 单工具超时(秒)</label>
                    <input type="number" id="qs-timeout" value="0" min="0" max="600" placeholder="0=默认"
                        style="width:100%;padding:8px 12px;border-radius:8px;border:1px solid #ddd;margin-top:4px;font-size:0.9rem;outline:none;" />
                </div>
                <div style="flex:1;min-width:140px;">
                    <label style="font-weight:600;color:#333;font-size:0.85rem;">📖 字典大小(Web模式)</label>
                    <select id="qs-wordlist" style="width:100%;padding:8px 12px;border-radius:8px;border:1px solid #ddd;margin-top:4px;font-size:0.9rem;">
                        <option value="small">小 (快速)</option>
                        <option value="medium" selected>中 (标准)</option>
                        <option value="large">大 (全面)</option>
                    </select>
                </div>
            </div>
            <div style="display:flex;gap:10px;">
                <button id="qs-start" style="flex:1;padding:14px;border:none;border-radius:12px;background:linear-gradient(135deg,var(--theme-primary),#9c27b0);color:#fff;font-size:1rem;font-weight:700;cursor:pointer;box-shadow:0 4px 15px rgba(106,76,147,0.3);">
                    ⚡ 开始扫描
                </button>
                <button id="qs-stop" style="display:none;padding:14px 24px;border:none;border-radius:12px;background:var(--theme-accent);color:#fff;font-size:1rem;font-weight:700;cursor:pointer;">
                    ⏹ 中止
                </button>
            </div>
            <div id="qs-status" style="margin-top:12px;padding:10px 14px;border-radius:10px;background:#f5f5f5;display:none;font-size:0.9rem;"></div>
            <div id="qs-result" style="margin-top:16px;"></div>
        </div>
        <div class="window-resize-handle"></div>
    </div>

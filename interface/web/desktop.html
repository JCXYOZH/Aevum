<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Aevum · 社区共建的社区平台</title>
<link rel="icon" href="assets/favicon.ico" sizes="any">
<link rel="icon" href="assets/favicon-32.png" type="image/png" sizes="32x32">
<link rel="stylesheet" href="styles/desktop/tokens.css">
<link rel="stylesheet" href="styles/presence.css">
<link rel="stylesheet" href="styles/desktop/shell.css">
<link rel="stylesheet" href="styles/desktop/windows.css">
<link rel="stylesheet" href="styles/desktop/launchpad.css">
<link rel="stylesheet" href="styles/desktop/panels.css">
<link rel="stylesheet" href="styles/desktop/camera.css">
<link rel="stylesheet" href="styles/desktop/dialog.css">
<link rel="stylesheet" href="styles/scene3d.css">
<link rel="stylesheet" href="styles/world-controls.css?v=20261119x">
<link rel="stylesheet" href="styles/desktop/responsive.css">

</head>
<body data-page="desktop">
<div class="shell">
  <header class="topbar">
    <div class="brand">
      <div class="brand__mark">A</div>
      <div>
        <p class="brand__name">AEVUM</p>
        <p class="brand__sub">社区共建的社区平台</p>
      </div>
    </div>

    <div class="topbar__status">
      <button class="pill" type="button" data-svc="bridge" data-state="wait"><i></i><span>内核</span></button>
      <button class="pill" type="button" data-svc="relay" data-state="wait"><i></i><span>中继</span></button>
      <button class="pill" type="button" data-svc="trainer" data-state="wait"><i></i><span>训练</span></button>
      <button class="pill" type="button" data-svc="web" data-state="wait"><i></i><span>页面</span></button>
    </div>

    <div class="topbar__right">
      <span class="clock" id="clock">--:--:--</span>
      <button class="tbtn" type="button" id="open-launchpad">启动台</button>
      <button class="tbtn" type="button" id="open-world">世界</button>
      <button class="tbtn tbtn--solid" type="button" id="open-add">新增窗口</button>
    </div>
  </header>

  <div class="world-controls world-controls--desktop" id="worldControls" aria-label="World time and weather controls">
    <div class="control-head">
      <span>世界环境</span>
      <div class="control-actions">
        <span id="controlState">BOOTING</span>
        <button class="control-toggle" type="button" id="controlToggle" aria-expanded="true">隐藏</button>
      </div>
    </div>
    <div class="control-group">
      <div class="control-label"><span>时间</span><b id="timeLabel">--:--</b></div>
      <input id="timeSlider" type="range" min="0" max="1439" step="1" value="1036">
      <div class="control-chips" id="timeChips">
        <button type="button" data-time="432">黎明</button>
        <button type="button" data-time="720">正午</button>
        <button type="button" data-time="1032">黄昏</button>
        <button type="button" data-time="1296">夜晚</button>
      </div>
    </div>
    <div class="control-group">
      <div class="control-label"><span>天气</span><b id="weatherLabel">--</b></div>
      <div class="control-chips" id="weatherChips">
        <button type="button" data-weather="clear">晴</button>
        <button type="button" data-weather="cloudy">多云</button>
        <button type="button" data-weather="rain">雨</button>
        <button type="button" data-weather="storm">暴风雨</button>
        <button type="button" data-weather="snow">雪</button>
        <button type="button" data-weather="fog">雾</button>
      </div>
    </div>
  </div>

  <aside class="dock" aria-label="启动项">
    <div class="dock__presence" aria-hidden="true">
      <div class="presence presence--dock">
        <span class="presence__halo"></span>
        <span class="presence__halo presence__halo--alt"></span>
        <span class="presence__core"></span>
      </div>
    </div>
    <div class="dock__label">启动项</div>
    <button class="dock__btn" type="button" data-open="mrhua" data-dock="mrhua"></button>
    <button class="dock__btn" type="button" data-open="subscribe" data-dock="subscribe"></button>
    <button class="dock__btn" type="button" data-open="kernel" data-dock="kernel"></button>
    <button class="dock__btn" type="button" data-open="exhibit" data-dock="exhibit"></button>
<button class="dock__btn" type="button" data-open="camera" data-dock="camera"></button>
    <div class="dock__sep"></div>
    <div class="dock__label">桌面</div>
    <button class="dock__btn" type="button" id="dock-launchpad" data-dock="launchpad"></button>
    <div class="dock__spacer"></div>
    <button class="dock__btn" type="button" id="dock-add" data-dock="add"></button>
  </aside>

  <main class="desk">
    <!-- The world is rendered inside the scene layer, not as an iframe. -->
    <div class="scene3d" id="scene3d"></div>
    <div class="windows" id="windows"></div>
    <div class="scene3d__characters-layer" id="scene-characters" aria-hidden="true"></div>
    <div class="desk__hint">拖拽标题栏移动窗口 · 双击标题栏最大化 · 右下角调整大小</div>

    <div class="launchpad" id="launchpad" hidden>
      <div class="launchpad__head">
        <div>
          <div class="eyebrow">启动台 / 桌面程序</div>
          <h2>选择要打开的窗口</h2>
        </div>
        <button class="tbtn" type="button" id="close-launchpad">返回桌面</button>
      </div>
      <div class="launchpad__grid" id="launchpad-grid"></div>
      <p class="launchpad__note">启动台只显示当前可用的程序：MrHua 工作台、订阅、内核实况、展示页和拍照。新增的自定义窗口保存在本机；不在这里解释技术实现。</p>
    </div>
  </main>

  <footer class="foot">
    <span>AEVUM · 社区共建</span>
    <span id="foot-state">监控服务：连接中</span>
    <span>127.0.0.1 · 本机桌面</span>
  </footer>
</div>

<div class="dialog" id="add-dialog" hidden>
  <div class="dialog__box">
    <h3>新增窗口</h3>
    <p>给启动台留一个位置。地址可以是同源页面、局域网地址或任意 http(s) 页面；跨域页面可能拒绝被 iframe 嵌套。</p>
    <div class="field">
      <label for="custom-title">窗口名</label>
      <input id="custom-title" maxlength="24" placeholder="例如：构建记录房" autocomplete="off">
    </div>
    <div class="field">
      <label for="custom-url">页面地址</label>
      <input id="custom-url" maxlength="800" placeholder="例如：http://127.0.0.1:9000/ 或 notes.html" autocomplete="off">
    </div>
    <div class="dialog__err" id="add-error"></div>
    <div class="dialog__actions">
      <button class="tbtn" type="button" id="add-cancel">取消</button>
      <button class="tbtn tbtn--solid" type="button" id="add-save">加入启动台</button>
    </div>
  </div>
</div>

<template id="win-template">
  <section class="win is-hidden" data-focus="0">
    <header class="win__bar">
      <div class="win__id">
        <span class="win__dot"></span>
        <span class="win__title"></span>
        <span class="win__meta"></span>
      </div>
      <div class="win__actions">
        <button type="button" data-win="min" title="最小化">—</button>
        <button type="button" data-win="max" title="最大化">□</button>
        <button type="button" data-win="close" title="关闭">×</button>
      </div>
    </header>
    <div class="win__body"></div>
    <span class="win__resize" aria-hidden="true"></span>
  </section>
</template>

<script src="js/desktop/core.js"></script>
<script src="js/desktop/api.js"></script>
<script src="js/desktop/components/terminal.js"></script>
<script src="js/desktop/components/line-chart.js"></script>
<script src="js/desktop/components/window.js"></script>
<script src="js/desktop/components/topbar.js"></script>
<script src="js/desktop/components/dock.js"></script>
<script src="js/desktop/components/launchpad.js"></script>
<script src="js/desktop/components/dialog.js"></script>
<script src="js/desktop/panels/kernel.js"></script>
<script src="js/desktop/panels/trainer.js"></script>
<script src="js/desktop/panels/model.js"></script>
<script src="js/desktop/panels/relay.js"></script>
<script src="js/desktop/panels/errors.js"></script>
<script src="js/desktop/panels/exhibit.js"></script>
<script src="js/desktop/panels/camera.js"></script>
<script src="js/desktop/panels/subscribe.js"></script>
<script src="/mrhua/js/loop-subscribe.js"></script>
<script src="js/desktop/main.js"></script>
<script>
  /* 先让窗口、启动项和监控状态出来，再装载 3D 引擎与角色模型。
     这些脚本单独按顺序注入，不阻塞首屏；页面本身已经完全可见后再开始建场景。 */
  (function () {
    var sceneScripts = [
      "/engine/math/math.js",
      "/engine/formats/gltf/glb.js",
      "/engine/formats/gltf/gltf-accessor.js",
      "/engine/formats/gltf/gltf-animation.js",
      "/engine/formats/vrm/vrm.js",
      "/engine/formats/pmx/pmx.js",
      "/engine/formats/texture/tga.js",
      "/engine/render/procedural/procedural-animation.js",
      "/engine/render/look/look-controller.js",
      "/engine/render/retarget/animation-retarget.js",
      "/engine/render/vrm/vrm-renderer.js",
      "/engine/render/pmx/webgl-renderer.js",
      "/engine/vendor/live2dcubismcore.min.js",
      "/engine/render/live2d/live2d-renderer.js",
      "/engine/world/pipeline/world-pipeline.js?v=20261119h",
      "/engine/world/advanced/world-advanced.js?v=20261119c",
      "js/scene/scene-core.js",
      "js/scene/models.config.js",
      "js/scene/scene-vrm.js",
      "js/scene/scene-pmx.js",
      "js/scene/scene-live2d.js",
      "js/scene/scene-desktop.js",
      "js/scene/scene-world.js?v=20261119cf",
      "js/scene/world-controls.js?v=20261119x"
    ];

    function loadSceneScripts() {
      var index = 0;
      function next() {
        if (index >= sceneScripts.length) {
          document.documentElement.setAttribute("data-scene-ready", "1");
          return;
        }
        var script = document.createElement("script");
        script.src = sceneScripts[index++];
        script.async = false;
        script.onload = next;
        script.onerror = function () {
          console.error("[scene] 装载失败：" + script.src);
          next();
        };
        document.head.appendChild(script);
      }
      next();
    }

    function scheduleScene() {
      var run = function () { window.setTimeout(loadSceneScripts, 60); };
      if ("requestIdleCallback" in window) {
        window.requestIdleCallback(run, { timeout: 1200 });
      } else {
        run();
      }
    }

    if (document.readyState === "complete") scheduleScene();
    else window.addEventListener("load", scheduleScene, { once: true });
  })();
</script>
<script>(function(){if(new URLSearchParams(location.search||"").get("world")!=="1")return;document.documentElement.setAttribute("data-world","1");})();</script>
<script>(function(){var b=document.getElementById("open-world");if(!b)return;var on=new URLSearchParams(location.search||"").get("world")==="1";b.textContent=on?"网格":"世界";b.addEventListener("click",function(){var u=new URL(location.href);if(on)u.searchParams.delete("world");else u.searchParams.set("world","1");location.href=u;});})();</script>
</body>
</html>
